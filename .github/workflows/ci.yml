name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python }} / core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile maintained Python
        run: python3 -m py_compile distill_offline.py scripts/*.py
      - name: Test dependency-free behavior
        run: python3 -m unittest discover -s tests -v
      - name: Check generated documentation
        run: python3 scripts/generate_repo_docs.py --check

  semantic:
    # The pinned client repository is private. Do not silently require a credential
    # for the public stdlib gate, and never expose this credential to a fork PR.
    if: vars.DISTILL_SEMANTIC_CI == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: Python ${{ matrix.python }} / semantic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Read pinned private client
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: mithudso/ollama-client
          ref: 740aca7cbc5aab4941779f35f1ca17b59fe73c7f
          token: ${{ secrets.OLLAMA_CLIENT_READ_TOKEN }}
          path: .ci/ollama-client
          persist-credentials: false
      - name: Install pinned client and current package
        run: |
          python3 -m pip install .ci/ollama-client
          python3 -m pip install --no-deps .
      - name: Compile maintained Python
        run: python3 -m py_compile distill_offline.py scripts/*.py
      - name: Test with optional client
        run: python3 -m unittest discover -s tests -v
      - name: Check generated documentation
        run: python3 scripts/generate_repo_docs.py --check
