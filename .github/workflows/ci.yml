name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python }} / ${{ matrix.client }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
        client: [core, semantic]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install optional shared client
        if: matrix.client == 'semantic'
        run: python3 -m pip install '.[semantic]'
      - name: Compile maintained Python
        run: python3 -m py_compile distill_offline.py scripts/*.py
      - name: Test behavior
        run: python3 -m unittest discover -s tests -v
      - name: Check generated documentation
        run: python3 scripts/generate_repo_docs.py --check
